<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>На сколько % Вы СГ?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C0B12; --card:#1F1E25; --opt:#2A2930; --line:#3A3942; --ink:#FFFFFF; --muted:#9A99A6;
  --violet:#3B82F6; --violet-2:#60A5FA; --cyan:#67E8F9; --sel:#172A47;
  --grad:linear-gradient(90deg,#3B82F6 0%,#4FA3F7 50%,#67E8F9 100%);
  --btn:linear-gradient(90deg,#2563EB,#3B82F6);
  --font:"Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark; } }
:root[data-theme="dark"]{ color-scheme:dark; }
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:660px;margin:0 auto;padding:48px 20px 64px}
[hidden]{display:none !important}
h1,h2,h3{margin:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

.btn{border:0;border-radius:16px;background:var(--btn);color:#fff;font-weight:800;font-size:18px;padding:18px 34px;
  box-shadow:0 8px 40px rgba(59,130,246,.45);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 48px rgba(59,130,246,.6)}
.btn:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none}
.btn-outline{background:transparent;border:1.5px solid #2F5BB0;border-radius:16px;color:var(--violet-2);font-weight:800;padding:16px 28px}

/* start */
#start{text-align:center;padding-top:4vh}
.badge{display:inline-block;padding:10px 22px;border-radius:999px;background:#14213A;border:1.5px solid #2A4775;
  color:var(--violet-2);font-weight:600;letter-spacing:.02em;margin-bottom:36px}
.hero-title{position:relative;font-weight:800;font-size:clamp(52px,14vw,96px);line-height:1;letter-spacing:-0.03em;margin-bottom:26px}
.hero-title::before{content:"";position:absolute;inset:-20% 10%;background:radial-gradient(closest-side,rgba(59,130,246,.28),transparent);z-index:-1;filter:blur(10px)}
.sub{font-weight:800;font-size:clamp(20px,5vw,26px);margin-bottom:18px}
.lead{color:var(--muted);max-width:26em;margin:0 auto}
.divider{width:80px;height:3px;border-radius:3px;margin:30px auto;background:linear-gradient(90deg,transparent,#2563EB,transparent)}
.meta{color:var(--muted);font-size:15px;margin-top:22px}

/* quiz */
.top{display:flex;justify-content:space-between;color:#C9C8D3;font-size:16px;margin-bottom:12px}
.bar{height:5px;background:#1E1D25;border-radius:5px;overflow:hidden;margin-bottom:34px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3B82F6,#67E8F9);border-radius:5px;transition:width .35s}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:28px;padding:34px 28px 28px}
.cat{color:var(--violet);font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:14px}
.q{font-weight:800;font-size:clamp(21px,5vw,27px);line-height:1.3;margin-bottom:26px}
.video{aspect-ratio:16/9;background:#000;border:1.5px solid var(--line);border-radius:18px;display:grid;place-items:center;
  color:var(--muted);text-align:center;padding:16px;margin-bottom:22px;overflow:hidden}
.video video{width:100%;height:100%;object-fit:contain}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:18px;width:100%;text-align:left;background:var(--opt);border:1.5px solid var(--line);
  border-radius:16px;padding:16px 18px;font-weight:600;font-size:17px;transition:border-color .15s,background .15s}
.opt:hover{border-color:#5B5A66}
.opt .l{flex:none;display:grid;place-items:center;width:36px;height:36px;border:1.5px solid #6A6975;border-radius:10px;
  color:#B9B8C4;font-size:14px;font-weight:700}
.opt.on{border-color:var(--violet-2);background:var(--sel);box-shadow:0 0 0 1px rgba(96,165,250,.25)}
.opt.on .l{border-color:var(--violet-2);color:var(--violet-2)}
.scale{display:grid;grid-template-columns:repeat(auto-fit,minmax(46px,1fr));gap:8px}
.scale .opt{justify-content:center;padding:14px 0;font-weight:800}
.ends{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-top:10px}
.foot{display:flex;justify-content:flex-end;margin-top:28px}

/* result */
#result{text-align:center;padding-top:3vh}
.pct{position:relative;font-weight:800;font-size:clamp(96px,26vw,170px);line-height:1;letter-spacing:-0.04em;margin-bottom:22px}
.pct::before{content:"";position:absolute;inset:-10% 15%;background:radial-gradient(closest-side,rgba(59,130,246,.3),transparent);z-index:-1}
.rt{font-weight:800;font-size:clamp(28px,7vw,40px);margin-bottom:14px}
.rd{color:var(--muted);max-width:28em;margin:0 auto 32px}
.rcard{background:var(--card);border:1.5px solid var(--line);border-radius:28px;padding:28px 20px;color:var(--muted);margin-bottom:28px}
.rcard b{color:#D9D8E2}
.rcard .h{margin-bottom:12px}
.actions{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
#saveNote{color:var(--muted);font-size:14px;min-height:1.4em;margin-top:14px}

@media (max-width:480px){
  .card{padding:26px 18px 20px;border-radius:22px}
  .foot .btn{width:100%}
  .actions .btn,.actions .btn-outline{width:100%}
}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<main>
  <section id="start">
    <div class="badge">⏰ Квиз про Светлану</div>
    <h1 class="hero-title grad">На сколько %<br>Вы СГ?</h1>
    <p class="sub">Квиз-проверка настоящего лидера</p>
    <p class="lead">12 вопросов. Честные ответы. Узнайте, насколько Вы похожи на Светлану Горюшкину — лидера и гуру тайм-менеджмента.</p>
    <div class="divider"></div>
    <button class="btn" id="go">Начать испытание →</button>
    <p class="meta">~4 минуты · 12 вопросов</p>
  </section>

  <section id="quiz" hidden>
    <div class="top"><span id="qnum"></span><span id="score"></span></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="card">
      <div class="cat" id="cat"></div>
      <h2 class="q" id="qtext"></h2>
      <div id="media"></div>
      <div id="opts"></div>
      <div class="foot"><button class="btn" id="next" disabled>Дальше →</button></div>
    </div>
  </section>

  <section id="result" hidden>
    <div class="pct grad" id="rpct">0%</div>
    <h2 class="rt" id="rtitle"></h2>
    <p class="rd" id="rtext"></p>
    <div class="rcard">
      <p class="h">Твой результат</p>
      <p>Набрано баллов: <b id="rpts"></b> из <b id="rmax">120</b></p>
      <p>Совпадение с СГ: <b id="rpct2"></b></p>
    </div>
    <div class="actions">
      <button class="btn" id="save" hidden>📸 Скачать для Инстаграма</button>
      <button class="btn-outline" id="again">Пройти ещё раз</button>
    </div>
    <p id="saveNote" aria-live="polite"></p>
  </section>
</main>

<script>
// ===== ВОПРОСЫ =====
// a = индекс правильного ответа (с нуля). Для шкал: target = идеальный ответ, баллы уменьшаются по мере удаления от него.
const Q = [
  {cat:"💼 Бизнес", t:"Какой у вас был бизнес?", o:["Цветочный магазин","Рекрутинговое агентство","Кофейня","Туристическое агентство"], a:2},
  {cat:"📊 Самочувствие", t:"Оцените своё состояние в этом квартале по шкале от 1 до 10", scale:[1,10], target:10, lo:"1", hi:"10"},
  {cat:"🏃‍♀️ Спорт", t:"Во сколько вы встаёте на пробежку?", o:["8:00 утра","9:00 утра","6:30 утра","Не бегаю"], a:2},
  {cat:"🎁 Мерч", t:"Какой мерч вы выберете в качестве новогоднего подарка?", o:["Рюкзак","Колонку","Белую футболку размера XS","Йога-коврик"], a:2},
  {cat:"🏆 TGS", t:"Вы организуете TGS-вечеринку для годовых победителей. Что в ней самое важное?", o:["Победители должны получить классные подарки","Руководители должны поздравить победителей публично","Победители должны плакать на сцене","Получить максимальные оценки в опросе"], a:2},
  {cat:"✅ Согласование", t:"Вам прислали решение на согласование. Что вы ответите?", o:["Ок, давай","Давай подумаем ещё","Не подходит","Переделываем"], a:0},
  {cat:"👏 Команда", t:"Ваш подчинённый отлично справился со сложной задачей. Как вы его похвалите?", o:["Богиня!","МОЛОДЕЦ!","Это лучший результат за последнее время","Продолжайте в том же духе"], a:1},
  {cat:"🏝️ Отпуск", t:"Вы едете в отпуск. Что будете делать, если вам прилетят сообщения в Слак?", o:["В отпуске в Слак не захожу","Письменно отвечу, но на встречи подключаться не буду","Поставлю статус «В отпуске» и отвечу через 5 минут","Отвечу на всё и проведу пару созвонов с пляжа"], a:1},
  {cat:"📚 Чтение", t:"Какую книгу вы выберете почитать?", o:["«Тревожные люди» — Ф. Бакман","«Кафе на краю Земли» — Джон Стрелеки","Серии «Лабиринты Ехо», «Хроники Ехо», «Сновидения Ехо» — Макс Фрай","«Чёрные кувшинки» — Мишель Бюсси"], a:2},
  {cat:"🌙 Вечер", t:"У вас есть свободный вечер. Как вы его проведёте?", o:["Конечно, в классном джаз-клубе","Посижу на пустынном пляже и буду любоваться звёздами","Разомнусь в спортзале","Останусь дома и посмотрю кино"], a:0},
  {cat:"⏱️ Тайм-менеджмент", t:"Кто вы в тайм-менеджменте?", scale:[0,10], target:10, lo:"0 = новичок", hi:"10 = мастодонт"},
  {cat:"🌿 Балкон", t:"Какой цветок растёт у вас на балконе?", o:["Фейхоа","Кумкват","Эвкалипт","Розы"], a:1},
];
const TIERS = [
  [30,  "🌱 Начинающий СГ", "Начните с малого: будильник на 6:30 и пробежка. Остальное приложится."],
  [60,  "⚡ Хорошая база", "Кое-что общее со Светланой у Вас точно есть. Ещё немного дисциплины — и процент вырастет."],
  [90,  "🔥 Почти СГ", "Ещё немного — и Вас можно спутать. Осталось завести кумкват на балконе."],
  [100, "👑 Вы и есть СГ", "Или знаете Светлану лучше всех. Максимальный результат."],
];
const LETTERS = "ABCD";

const $ = id => document.getElementById(id);
const N = Q.length;
let i = 0, total = 0, picked = null;

function pts(n){const a=n%10,b=n%100;
  if(a===1&&b!==11) return n+" балл";
  if(a>=2&&a<=4&&(b<12||b>14)) return n+" балла";
  return n+" баллов";}

function points(q,v){
  if(q.scale){ const range=q.scale[1]-q.scale[0]; return Math.max(0, Math.round(10*(1-Math.abs(v-q.target)/range))); }
  return v===q.a ? 10 : 0;
}

function show(id){ for(const s of document.querySelectorAll("main > section")) s.hidden = s.id!==id; window.scrollTo(0,0); }

function render(){
  const q=Q[i]; picked=null;
  $("qnum").textContent=`Вопрос ${i+1} из ${N}`;
  $("score").textContent=pts(total);
  $("barFill").style.width=(i/N*100)+"%";
  $("cat").textContent=q.cat;
  $("qtext").textContent=q.t;
  $("next").disabled=true;
  $("next").textContent = i===N-1 ? "Узнать результат →" : "Дальше →";
  const media=$("media");
  if("video" in q){
    media.innerHTML = q.video ? `<div class="video"><video controls playsinline preload="metadata" src="${q.video}"></video></div>`
                              : `<div class="video">Здесь будет видео с Саммита</div>`;
  } else media.innerHTML="";
  const box=$("opts"); box.innerHTML="";
  const wrap=document.createElement("div");
  if(q.scale){
    wrap.className="scale";
    for(let v=q.scale[0]; v<=q.scale[1]; v++) wrap.appendChild(optBtn(String(v), null, v));
    box.appendChild(wrap);
    const ends=document.createElement("div"); ends.className="ends";
    const l=document.createElement("span"), r=document.createElement("span");
    l.textContent=q.lo; r.textContent=q.hi; ends.append(l,r); box.appendChild(ends);
  } else {
    wrap.className="opts";
    q.o.forEach((txt,idx)=>wrap.appendChild(optBtn(txt, LETTERS[idx], idx)));
    box.appendChild(wrap);
  }
}

function optBtn(text, letter, val){
  const b=document.createElement("button"); b.className="opt"; b.type="button";
  if(letter){ const l=document.createElement("span"); l.className="l"; l.textContent=letter; b.appendChild(l); }
  const s=document.createElement("span"); s.textContent=text; b.appendChild(s);
  b.onclick=()=>{
    picked=val;
    for(const o of $("opts").querySelectorAll(".opt")) o.classList.toggle("on", o===b);
    $("next").disabled=false;
  };
  return b;
}

$("next").onclick=()=>{
  if(picked===null) return;
  total+=points(Q[i],picked);
  if(i<N-1){ i++; render(); } else finish();
};

function tier(p){ return TIERS.find(t=>p<=t[0]); }

function finish(){
  $("barFill").style.width="100%";
  const pct=Math.round(total/(N*10)*100), t=tier(pct);
  $("rmax").textContent=N*10;
  show("result");
  $("rtitle").textContent=t[1]; $("rtext").textContent=t[2];
  $("rpts").textContent=total; $("rpct2").textContent=pct+"%";
  const el=$("rpct");
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){ el.textContent=pct+"%"; return; }
  const t0=performance.now(), dur=1300;
  (function step(now){
    const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3);
    el.textContent=Math.round(pct*e)+"%";
    if(k<1) requestAnimationFrame(step);
  })(t0);
}

$("go").onclick=()=>{ i=0; total=0; show("quiz"); render(); };
$("again").onclick=()=>{ $("saveNote").textContent=""; show("start"); };

// ===== звёздочки на фоне =====
(function(){
  const c=$("stars"), x=c.getContext("2d"); let dots=[];
  function size(){
    const d=window.devicePixelRatio||1; c.width=innerWidth*d; c.height=innerHeight*d; x.setTransform(d,0,0,d,0,0);
    dots=Array.from({length:Math.round(innerWidth*innerHeight/14000)},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.6+.4,a:Math.random()*.5+.15}));
    x.clearRect(0,0,innerWidth,innerHeight);
    for(const p of dots){ x.beginPath(); x.arc(p.x,p.y,p.r,0,7); x.fillStyle=`rgba(59,130,246,${p.a})`; x.fill(); }
  }
  size(); addEventListener("resize",size);
})();

// ===== картинка для Инстаграма =====
let downloads=null;
const inClaude = !!(window.claude && window.claude.use);
(async()=>{
  if(!inClaude){ $("save").hidden=false; return; }
  try{ downloads=await window.claude.use("downloads"); if(downloads) $("save").hidden=false; }catch(e){}
})();

function wrapText(ctx,text,x,y,maxW,lh){
  const words=text.split(" "); let line="";
  for(const w of words){ const t=line?line+" "+w:w;
    if(ctx.measureText(t).width>maxW&&line){ ctx.fillText(line,x,y); line=w; y+=lh; } else line=t; }
  if(line) ctx.fillText(line,x,y); return y+lh;
}

async function storyBlob(){
  await document.fonts.ready;
  const pct=Math.round(total/(N*10)*100), t=tier(pct);
  const c=document.createElement("canvas"); c.width=1080; c.height=1920; const x=c.getContext("2d");
  x.fillStyle="#0C0B12"; x.fillRect(0,0,1080,1920);
  const g=x.createRadialGradient(540,860,0,540,860,520); g.addColorStop(0,"rgba(59,130,246,.35)"); g.addColorStop(1,"rgba(59,130,246,0)");
  x.fillStyle=g; x.fillRect(0,0,1080,1920);
  for(let k=0;k<90;k++){ x.beginPath(); x.arc(Math.random()*1080,Math.random()*1920,Math.random()*3+1,0,7); x.fillStyle=`rgba(59,130,246,${Math.random()*.5+.15})`; x.fill(); }
  x.textAlign="center";
  x.font='600 40px Inter, sans-serif'; x.fillStyle="#60A5FA"; x.fillText("⏰ Квиз про Светлану",540,330);
  x.font='800 84px Inter, sans-serif'; x.fillStyle="#FFFFFF"; x.fillText("На сколько % Вы СГ?",540,460);
  const lg=x.createLinearGradient(200,0,880,0); lg.addColorStop(0,"#60A5FA"); lg.addColorStop(.5,"#4FA3F7"); lg.addColorStop(1,"#67E8F9");
  x.font='800 300px Inter, sans-serif'; x.fillStyle=lg; x.fillText(pct+"%",540,1000);
  x.font='800 76px Inter, sans-serif'; x.fillStyle="#FFFFFF"; let y=wrapText(x,t[1],540,1200,920,90);
  x.font='500 42px Inter, sans-serif'; x.fillStyle="#9A99A6"; wrapText(x,t[2],540,y+20,860,60);
  return await new Promise(r=>c.toBlob(r,"image/png"));
}

$("save").onclick=async()=>{
  const note=$("saveNote"); note.textContent="Готовим картинку…";
  try{
    const blob=await storyBlob(), name=`sg-quiz-${total}.png`;
    if(downloads){ await downloads.save({filename:name,data:blob}); }
    else{ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }
    note.textContent="Картинка сохранена.";
  }catch(e){
    if(e&&e.code==="declined") note.textContent="";
    else if(e&&e.code==="rate_limited") note.textContent="Подождите пару секунд и нажмите ещё раз.";
    else note.textContent="Скачивание сейчас недоступно.";
  }
};
</script>
</body>
</html>
